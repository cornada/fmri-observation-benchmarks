name: Reproduce examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-repro.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - name: Run all five examples
        run: |
          for paper in papers/*; do
            python "$paper/run.py" --output "results/$(basename "$paper").json"
          done
      - name: Replay complete synthetic case
        run: python papers/05_transition_benchmark/run.py --mode case --output results/full_case.json
